name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/ci-${{ matrix.os }}-${{ matrix.build_type }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_TESTING=ON -DIMTG_BUILD_COMMERCE=ON
      - name: Build
        run: cmake --build build/ci-${{ matrix.os }}-${{ matrix.build_type }} --config ${{ matrix.build_type }} --parallel
      - name: Test
        run: ctest --test-dir build/ci-${{ matrix.os }}-${{ matrix.build_type }} --build-config ${{ matrix.build_type }} --output-on-failure
      - name: Install
        run: cmake --install build/ci-${{ matrix.os }}-${{ matrix.build_type }} --config ${{ matrix.build_type }} --prefix build/install-${{ matrix.os }}-${{ matrix.build_type }}
      - name: Configure public-header checks
        run: cmake -S tests/public_headers -B build/headers-${{ matrix.os }}-${{ matrix.build_type }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DIMTG_REQUIRE_COMMERCE=ON -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/install-${{ matrix.os }}-${{ matrix.build_type }}
      - name: Build public-header checks
        run: cmake --build build/headers-${{ matrix.os }}-${{ matrix.build_type }} --config ${{ matrix.build_type }} --parallel
      - name: Configure installed consumer
        run: cmake -S tests/install_consumer -B build/consumer-${{ matrix.os }}-${{ matrix.build_type }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/install-${{ matrix.os }}-${{ matrix.build_type }}
      - name: Build installed consumer
        run: cmake --build build/consumer-${{ matrix.os }}-${{ matrix.build_type }} --config ${{ matrix.build_type }} --parallel
      - name: Configure installed commerce consumer
        run: cmake -S tests/install_commerce_consumer -B build/commerce-consumer-${{ matrix.os }}-${{ matrix.build_type }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/install-${{ matrix.os }}-${{ matrix.build_type }}
      - name: Build installed commerce consumer
        run: cmake --build build/commerce-consumer-${{ matrix.os }}-${{ matrix.build_type }} --config ${{ matrix.build_type }} --parallel

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Configure ASan/UBSan
        run: >-
          cmake -S . -B build/asan-ubsan -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DIMTG_BUILD_COMMERCE=ON
          -DIMTG_BUILD_MDBX=ON
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build/asan-ubsan --parallel
      - name: Test
        run: ctest --test-dir build/asan-ubsan --output-on-failure

  core-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure core-only build
        run: cmake -S . -B build/core-only -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DIMTG_BUILD_COMMERCE=OFF
      - name: Build core-only target
        run: cmake --build build/core-only --parallel
      - name: Test core-only target
        run: ctest --test-dir build/core-only --output-on-failure
      - name: Install core-only package
        run: cmake --install build/core-only --prefix build/install-core-only
      - name: Configure core-only consumer
        run: cmake -S tests/install_consumer -B build/core-only-consumer -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/install-core-only
      - name: Build core-only consumer
        run: cmake --build build/core-only-consumer --parallel

  mdbx:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Configure optional MDBX adapter
        run: >-
          cmake -S . -B build/mdbx-${{ matrix.os }}-${{ matrix.build_type }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTING=ON
          -DIMTG_BUILD_MDBX=ON
          -DMDBXC_DEPS_MODE=BUNDLED
          -DMDBXC_BUILD_EXAMPLES=OFF
          -DMDBXC_BUILD_TESTS=OFF
      - name: Build optional MDBX adapter
        run: cmake --build build/mdbx-${{ matrix.os }}-${{ matrix.build_type }} --config ${{ matrix.build_type }} --parallel
      - name: Test optional MDBX adapter
        run: ctest --test-dir build/mdbx-${{ matrix.os }}-${{ matrix.build_type }} -C ${{ matrix.build_type }} --output-on-failure
      - name: Install source-only adapter package boundary
        run: cmake --install build/mdbx-${{ matrix.os }}-${{ matrix.build_type }} --config ${{ matrix.build_type }} --prefix build/mdbx-install-${{ matrix.os }}-${{ matrix.build_type }}
      - name: Configure installed core consumer without MDBX API
        run: cmake -S tests/install_consumer -B build/mdbx-consumer-${{ matrix.os }}-${{ matrix.build_type }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/mdbx-install-${{ matrix.os }}-${{ matrix.build_type }}
      - name: Build installed core consumer
        run: cmake --build build/mdbx-consumer-${{ matrix.os }}-${{ matrix.build_type }} --config ${{ matrix.build_type }} --parallel

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen and Graphviz
        run: sudo apt-get update && sudo apt-get install --yes doxygen graphviz
      - name: Configure documentation
        run: >-
          cmake -S . -B build/documentation
          -DBUILD_TESTING=OFF
          -DIMTG_BUILD_DOCUMENTATION=ON
      - name: Validate public API documentation
        run: cmake --build build/documentation --target imtg_documentation
